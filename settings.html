<div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
        <b>Message Chunker</b>
        <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content" style="font-size: 14px;">
        
        <label for="mchunker_mode">Operating Mode:</label>
        <select id="mchunker_mode" class="text_pole">
            <option value="off">Off</option>
            <option value="messages">Message Count Mode</option>
            <option value="tokens">Max Tokens Mode</option>
        </select>
        
        <hr>

        <div id="mchunker_chunk_container">
            <label for="mchunker_chunk_size">Chunk Size (Messages to remove at once):</label>
            <input id="mchunker_chunk_size" class="text_pole" type="number" min="1" step="1">
        </div>

        <div id="mchunker_messages_container" style="display: none; margin-top: 10px;">
            <label for="mchunker_min_messages">Minimum Messages to Keep:</label>
            <input id="mchunker_min_messages" class="text_pole" type="number" min="1" step="1">
            <div style="margin-top: 5px; opacity: 0.7;">
                <small><i>Max messages before chunking triggers: <span id="mchunker_max_messages_display">0</span></i></small>
            </div>
        </div>

        <div id="mchunker_tokens_container" style="display: none; margin-top: 10px;">
            <label for="mchunker_max_tokens">Maximum Context Tokens:</label>
            <input id="mchunker_max_tokens" class="text_pole" type="number" min="100" step="100">
        </div>

    </div>
</div>
